services:
  - type: web
    name: bioskop-app
    runtime: go
    plan: free
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app
    startCommand: ./app
    envVars:
      - key: GIN_MODE
        value: release
      - key: DATABASE_URL
        fromDatabase:
          name: bioskop-db
          property: connectionString

databases:
  - name: bioskop-db
    databaseName: bioskop_db
    plan: free
